<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Bağlantı isteği</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="request-window">
<div class="request-card" role="alertdialog" aria-labelledby="title">
  <div class="request-head"><img class="mark" src="../assets/icon.png" alt=""><h2 id="title">Bağlantı isteği</h2><span id="waiting" class="hint"></span></div>
  <p><strong id="from"></strong> <span id="name"></span></p>
  <p id="what" class="hint"></p>
  <div class="actions">
    <button id="reject">Reddet</button>
    <button id="accept" class="primary">Kabul et</button>
  </div>
</div>
<script src="request.js"></script>
</body>
</html>
