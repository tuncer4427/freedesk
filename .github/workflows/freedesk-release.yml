name: FreeDesk release

# Builds the Windows (.exe) and macOS (.dmg) apps and publishes them as a
# GitHub release. The apps check that release for updates.
#
# Trigger: push the commit to release to the `release` branch
# (`git push origin main:release`). The release tag is created from VERSION.
# Adapted from RustDesk's flutter-build.yml (Windows x64 + macOS jobs only).

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freedesk-release
  cancel-in-progress: true

env:
  SCITER_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.4"
  APP_NAME: "FreeDesk"
  APP_LOWER: "freedesk"
  # Public half of the update-signing key; the private seed is the
  # FREEDESK_UPDATE_ED25519_SEED repository secret.
  FREEDESK_UPDATE_ED25519_PUBLIC_KEY: "tt3gk4cWy+aKpEnsHdsk/14W7Bg2Q/o1JbZKBKvFQCI="

jobs:
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Version must match everywhere
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          pubspec_version="$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' flutter/pubspec.yaml | head -n1)"
          portable_version="$(sed -n 's/^version = "\(.*\)"/\1/p' libs/portable/Cargo.toml | head -n1)"
          echo "workflow=$VERSION cargo=$cargo_version pubspec=$pubspec_version portable=$portable_version ref=$GITHUB_REF"
          for v in "$cargo_version" "$pubspec_version" "$portable_version"; do
            if [ "$v" != "$VERSION" ]; then
              echo "::error::Version mismatch: expected $VERSION, found $v"
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION"
            exit 1
          fi

  generate-bridge:
    needs: [check-version]
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    needs: [check-version]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: Windows x64
    needs: [build-topmost-window, generate-bridge]
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build FreeDesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          # Virtual display driver
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        # Runner.rc does not contain the actual version, Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
          fi

      - name: Download topmost window artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Check reported version
        shell: powershell
        run: |
          $reportedVersion = (& ".\rustdesk\rustdesk.exe" --version | Out-String).Trim()
          if ($reportedVersion -cne $env:VERSION) {
            throw "App reports version '$reportedVersion', expected '$env:VERSION'"
          }

      - name: Build self-extracting executable
        shell: bash
        run: |
          # The launcher exe carries the app name; it loads librustdesk.dll.
          mv ./rustdesk/rustdesk.exe "./rustdesk/${APP_LOWER}.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${APP_LOWER}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/${APP_LOWER}-${VERSION}-x86_64.exe"
          ls -l ./SignOutput

      - name: Upload Windows EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64-exe
          path: ./SignOutput/${{ env.APP_LOWER }}-${{ env.VERSION }}-x86_64.exe
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.job.arch }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              extra-build-args: "",
              arch: x86_64,
              vcpkg-triplet: x64-osx,
            }
          - {
              target: aarch64-apple-darwin,
              os: macos-15,
              extra-build-args: "--screencapturekit",
              arch: aarch64,
              vcpkg-triplet: arm64-osx,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x from the official release; brew ships the incompatible 3.x.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        run: flutter config --no-enable-swift-package-manager

      - name: Patch flutter
        if: ${{ matrix.job.arch == 'x86_64' }}
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch sources for Flutter 3.44 (arm64)
        if: ${{ matrix.job.arch == 'aarch64' }}
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build FreeDesk
        run: |
          if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
            MIN_MACOS_VERSION="12.3"
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
            sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
            sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
            sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
            echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          fi
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Create DMG
        run: |
          APP="./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          test -d "$APP"
          reported_version="$("$APP/Contents/MacOS/${APP_NAME}" --version)"
          if [ "$reported_version" != "$VERSION" ]; then
            echo "::error::App reports version '$reported_version', expected '$VERSION'"
            exit 1
          fi
          # No Apple Developer ID: ad-hoc sign so the bundle is consistent and
          # runs on Apple Silicon.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          rm -f ./*.dmg
          create-dmg --icon "${APP_NAME}.app" 200 190 --hide-extension "${APP_NAME}.app" --window-size 800 400 --app-drop-link 600 185 "${APP_LOWER}-${VERSION}-${{ matrix.job.arch }}.dmg" "$APP"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.job.arch }}-dmg
          path: ./${{ env.APP_LOWER }}-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build-windows, build-macos]
    # Publish whatever was built, as long as the Windows build succeeded.
    if: ${{ !cancelled() && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.FREEDESK_UPDATE_ED25519_SEED }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-*
          path: ./artifacts/
          merge-multiple: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: ./artifacts/
          merge-multiple: true

      - name: Sign update metadata
        id: sign
        shell: bash
        env:
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ env.FREEDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ls -l ./artifacts
          if [ -z "${RUSTDESK_UPDATE_ED25519_SEED:-}" ]; then
            echo "::warning::FREEDESK_UPDATE_ED25519_SEED secret is not set: publishing without update metadata, so installed apps will not auto-update to this release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python res/update/generate_update_metadata.py check-key
          artifact_args=()
          verify_args=()
          add() {
            if [ -f "$4" ]; then
              artifact_args+=(--artifact "$1" "$2" "$3" "$4")
              verify_args+=(--artifact "$4")
            else
              echo "::warning::Missing artifact $4"
            fi
          }
          add windows x86_64 exe "./artifacts/${APP_LOWER}-${VERSION}-x86_64.exe"
          add macos aarch64 dmg "./artifacts/${APP_LOWER}-${VERSION}-aarch64.dmg"
          add macos x86_64 dmg "./artifacts/${APP_LOWER}-${VERSION}-x86_64.dmg"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          python res/update/generate_update_metadata.py sign \
            "${artifact_args[@]}" \
            --version "$VERSION" --release-id "$VERSION" \
            --package-id rustdesk \
            --release-base-url "$base_url" \
            --published-at "$(git log -1 --format=%cI)" \
            --metadata-out ./rustdesk-update.json \
            --signature-out ./rustdesk-update.json.sig
          python res/update/generate_update_metadata.py verify \
            --metadata ./rustdesk-update.json \
            --signature ./rustdesk-update.json.sig \
            "${verify_args[@]}" \
            --version "$VERSION" --release-id "$VERSION" \
            --package-id rustdesk \
            --release-base-url "$base_url"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish installers
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: FreeDesk ${{ env.VERSION }}
          prerelease: false
          fail_on_unmatched_files: true
          files: ./artifacts/*

      - name: Publish update metadata
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.VERSION }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./rustdesk-update.json.sig
            ./rustdesk-update.json

      # Installed apps read this file from the latest release to learn that a
      # newer version exists, so it is published last.
      - name: Publish version pointer
        if: steps.sign.outputs.signed == 'true'
        shell: bash
        run: |
          printf '{"url":"https://github.com/%s/releases/tag/%s"}\n' "$GITHUB_REPOSITORY" "$VERSION" > "./${APP_LOWER}-version.json"
          cat "./${APP_LOWER}-version.json"

      - name: Upload version pointer
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.VERSION }}
          prerelease: false
          fail_on_unmatched_files: true
          files: ./${{ env.APP_LOWER }}-version.json
