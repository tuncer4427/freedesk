name: FreeDesk Beta (new app)

# Builds the from-scratch FreeDesk app in next/ and publishes the installers
# to the rolling "app-latest" pre-release, which is also the update feed the
# installed apps read.
#
# Trigger: push the commit to build to the `next-release` branch
# (`git push origin main:next-release`).

on:
  push:
    branches:
      - next-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freedesk-next
  cancel-in-progress: true

jobs:
  test-server:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: next/server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Install script is up to date
        run: |
          ./build-install-script.sh
          git diff --exit-code -- install-server.sh

  build:
    name: ${{ matrix.name }}
    needs: [test-server]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2022, script: "dist:win" }
          - { name: macOS, os: macos-15, script: "dist:mac" }
    defaults:
      run:
        working-directory: next/app
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run ${{ matrix.script }}
      - name: List output
        shell: bash
        run: ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-${{ matrix.name }}
          if-no-files-found: error
          path: |
            next/app/dist/*.exe
            next/app/dist/*.dmg
            next/app/dist/*.zip
            next/app/dist/*.blockmap
            next/app/dist/latest*.yml

  publish:
    needs: [build]
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: next-*
          path: ./out
          merge-multiple: true
      - run: ls -l ./out
      # Installers first, the latest*.yml update pointers last.
      - name: Publish installers
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: app-latest
          target_commitish: ${{ github.sha }}
          name: FreeDesk Beta (yeni uygulama)
          body: Sıfırdan yazılan yeni FreeDesk uygulamasının en güncel deneme sürümü.
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            ./out/*.exe
            ./out/*.dmg
            ./out/*.zip
            ./out/*.blockmap
      - name: Publish update pointers
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: app-latest
          prerelease: true
          fail_on_unmatched_files: false
          files: ./out/latest*.yml
